name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR 은 새 커밋이 오면 앞선 실행을 취소한다. main 푸시·스케줄은 커밋(sha)마다 따로 묶어 끝까지 돌린다 —
# ref 로 묶으면 연달아 머지될 때 대기 중이던 main 실행이 "cancelled" 로 밀려 그 커밋이 검사 없이 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 로컬 명령(CLAUDE.md·CONTRIBUTING.md)과 같은 `uv run --extra ...` 로 돌린다.
      # uv.lock 을 커밋하지 않으므로 매번 최신 해상도 — ruff 새 규칙이 CI 에서 먼저 걸릴 수 있다.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Ruff
        run: uv run --extra dev --extra mcp ruff check src tests examples

      - name: Ruff format check
        run: uv run --extra dev --extra mcp ruff format --check src tests examples
        continue-on-error: true  # 포매팅은 아직 강제하지 않는다

      - name: Mypy
        run: uv run --extra dev --extra mcp mypy

  docs:
    # 문서 사이트(mkdocs.yml)가 경고 없이 빌드되는지만 본다. 배포는 docs-deploy.yml (main 푸시).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - name: Check SEO meta (OG·Twitter·JSON-LD·hreflang·sitemap)
        run: python scripts/check_site_seo.py site

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run tests
        run: uv run --extra dev --extra mcp pytest tests/ -v --cov --cov-report=term

      # 커버리지 표를 실행 요약 페이지에 붙인다(외부 서비스·토큰 없음). 한 버전에서만.
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo
            uv run --extra dev --extra mcp coverage report --format=markdown
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  # 키움 REST 로 옮겨 오는 사용자 대부분이 Windows(OCX 시절의 PC)다. 단위 테스트를 Windows·macOS 에서도 돌려
  # 경로·인코딩(cp949 콘솔)·이벤트 루프 차이를 CI 에서 먼저 잡는다. 키·키움 서버 없이 끝난다.
  test-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run tests
        run: uv run --extra dev --extra mcp pytest tests/ -q

  # [mcp] extra 의 하한(pyproject `mcp>=2.0`)에서도 MCP 서버가 도는지 본다. 위 test 잡은 최신 mcp 만 깐다.
  # 하한을 올리면 이 핀도 같이 올린다 — tests/test_ci_mcp_floor.py 가 둘이 맞는지 본다.
  test-mcp-min:
    runs-on: ubuntu-latest
    env:
      MCP_MIN: "2.0.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: mcp 버전 확인
        run: |
          v=$(uv run --extra dev --extra mcp --with "mcp==$MCP_MIN" python -c "import importlib.metadata as m; print(m.version('mcp'))")
          echo "mcp $v"
          test "$v" = "$MCP_MIN"

      - name: Run tests (mcp==${{ env.MCP_MIN }})
        run: uv run --extra dev --extra mcp --with "mcp==$MCP_MIN" pytest tests/ -q

  # 배포물(sdist·wheel)이 실제로 쓸 만한지 본다 — 레포 체크아웃이 아니라 설치한 wheel 로.
  # 키·네트워크(키움 서버) 없이 끝난다. 무엇을 보는지는 scripts/check_dist.sh 주석에.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"

      - name: sdist·wheel 빌드 + 설치 스모크
        run: bash scripts/check_dist.sh

  # Claude Desktop 번들(.mcpb): 공식 CLI(@anthropic-ai/mcpb)로 manifest 검증 + 팩. 키·키움 서버 없이 끝난다.
  # 릴리스 태그 때는 mcpb-release.yml 이 같은 스크립트로 만들어 GitHub Release 에 붙인다.
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build + validate
        run: python scripts/build_mcpb.py --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error
