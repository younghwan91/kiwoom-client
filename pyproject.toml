[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiwoom-client"
version = "0.4.0"
description = "키움증권 REST API 파이썬 클라이언트 — 엔드포인트 182개·실시간 WebSocket·sync/async·AI 에이전트용 MCP 서버 (비공식) | Unofficial Python client for the Kiwoom Securities REST API with a built-in MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "kiwoom", "키움증권", "키움", "kiwoom-securities", "openapi",
    "stock", "trading", "자동매매", "퀀트", "quant", "algorithmic-trading",
    "rest-api", "websocket", "kospi", "kosdaq", "korea-finance", "investment",
    "asyncio", "async", "pandas", "주식", "증권", "자동주문",
    "mcp", "model-context-protocol", "ai-agents", "claude-code", "cursor",
    "mcp-server", "llm", "kiwoom-rest-api", "kiwoom-api", "키움 REST API", "krx", "trading-bot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
authors = [
    {name = "Younghwan Chae", email = "chyohw97@gmail.com"},
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
mcp = [
    "mcp>=1.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-awesome-nav>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
kiwoom = "kiwoom_client.cli:main"
kiwoom-client-mcp = "kiwoom_client.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/younghwan91/kiwoom-client"
Repository = "https://github.com/younghwan91/kiwoom-client"
Documentation = "https://github.com/younghwan91/kiwoom-client#readme"
Issues = "https://github.com/younghwan91/kiwoom-client/issues"
Changelog = "https://github.com/younghwan91/kiwoom-client/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwoom_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["kiwoom_client"]
branch = true

[tool.coverage.report]
# 수치는 CI 요약(GITHUB_STEP_SUMMARY)에만 낸다 — 아직 하한(fail_under)은 걸지 않는다.
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a contributor's global ruff config can't change CI.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 픽스처 이름·중첩 with 관례를 따른다.
"tests/*" = ["SIM117"]
# 실계좌 스모크 스크립트: 전 엔드포인트 호출 표라 줄바꿈이 오히려 읽기 나쁘다.
"tests/integration_api_smoke.py" = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/kiwoom_client"]
ignore_missing_imports = true
warn_unused_ignores = true
# 단계적으로 엄격하게 — 지금 통과하는 것만 켠다. 다음 후보: warn_return_any(응답 JSON 의 Any 를
# 좁히는 cast 가 auth·base 에 필요), no_implicit_reexport, warn_unreachable(websocket 재연결 루프 오탐).
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
extra_checks = true
